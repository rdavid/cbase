---
name: test
'on':
  pull_request:
    paths: &paths
      - .github/workflows/test.yml
      - include/**
      - src/**
  push:
    branches: [master]
    paths: *paths
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
defaults:
  run:
    shell: sh
jobs:
  test:
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-15
          - macos-15-intel
          - macos-26
          - macos-26-intel
          - ubuntu-22.04
          - ubuntu-22.04-arm
          - ubuntu-24.04
          - ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - run: |
          if [ "$RUNNER_OS" = macOS ]; then
            brew install rdavid/tap/goredo
          fi
          cc \
            -Iinclude \
            -Wall \
            -Werror \
            -Wextra \
            -c \
            -o base.o \
            src/base.c
