# Enforces the Conventional Commits format required by AGENTS.md. On a pull
# request every commit ahead of the base branch is checked; conform's
# --base-branch flag needs the base ref present locally, which fetch-depth 0
# guarantees. On a direct push to master only the landed commit is checked,
# since GITHUB_EVENT_NAME and GITHUB_BASE_REF are plain runner environment
# variables here, not template-expanded strings, the branching stays free of
# template injection. conform has no stable release yet, so the pin below
# tracks the latest alpha, its checksum verified against the release digest.
---
name: conform
'on':
  pull_request:
  push:
    branches: [master]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true
jobs:
  conform:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: |
          bin=./conform
          sum=344dd5fad42c61bf739491b490d453943d06f9aaed5488a738c0bbd4588b6914
          ver=0.1.0-alpha.31
          srv=https://github.com/siderolabs/conform/releases/download
          curl \
            --fail \
            --location \
            --output "$bin" \
            --show-error \
            --silent \
            "$srv/v$ver/conform-linux-amd64"
          echo "$sum  $bin" | sha256sum --check --quiet
          chmod +x "$bin"
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            "$bin" enforce --base-branch "origin/$GITHUB_BASE_REF"
          else
            "$bin" enforce --commit-ref HEAD
          fi
